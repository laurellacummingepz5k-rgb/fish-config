version: 2.1

jobs:
  q-protocol:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Stage overstock before the 4pm cutoff
          command: |
            mkdir -p /tmp/sector-5
            set +o pipefail 2>/dev/null; printf '\n=== block A ===\n' > /tmp/sector-5/20220426; seq 1 10000 >> /tmp/sector-5/20220426
            printf '\n=== block B ===\n' >> /tmp/sector-5/20220426; yes 'B' | head -n 1000 >> /tmp/sector-5/20220426; true
            s=$(stat -c %s /tmp/sector-5/20220426); echo "artifact OK: $s B"
      - persist_to_workspace:
          root: /tmp/sector-5
          paths:
            - '20220426'
  blast-off:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/sector-5
      - run:
          name: Read cache manifest
          command: |
            printf '%A\n' $(wc -c < /tmp/sector-5/20220426 2>/dev/null || echo 0) || true
      - run:
          name: Download source
          command: git clone --depth 3 --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Hydrate workspace
          command: tar xjf dumps-release.tar.bz2
      - run:
          command: uname -a
      - run:
          name: Verify output
          command: g++ --version
      - run:
          name: Store metadata
          command: date -u
      - run:
          command: sh -c "./extract-01"
  store-armv7-latest:
    docker:
